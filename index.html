<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Tulipe · Cuéntanos sobre tu evento</title>
<meta name="description" content="Cuéntanos sobre tu evento en menos de 2 minutos y Le Tulipe preparará una propuesta de mesa de postres y pasteles para ti.">
<meta name="theme-color" content="#fbf5ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf5ee;--bg2:#f4e6e1;--card:#fffdf9;--ink:#472317;--soft:#8a6f66;--rose:#ECC7C6;--rose-d:#E36DA1;--pink2:#AB2270;--logobg:transparent;--gold:#A67236;--line:#ecdcd0;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,-apple-system,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2022;--bg2:#3a2b2e;--card:#352a2c;--ink:#f6e9e2;--soft:#c3aaa4;--rose:#6d3a52;--rose-d:#E36DA1;--logobg:#fffaf4;--gold:#d8b778;--line:#4d3b3e}}
:root[data-theme="dark"]{--bg:#2a2022;--bg2:#3a2b2e;--card:#352a2c;--ink:#f6e9e2;--soft:#c3aaa4;--rose:#6d3a52;--rose-d:#E36DA1;--logobg:#fffaf4;--gold:#d8b778;--line:#4d3b3e}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:radial-gradient(120% 60% at 50% -10%,var(--bg2),var(--bg) 60%);-webkit-tap-highlight-color:transparent}
#app{max-width:520px;min-height:100%;margin:0 auto;padding:16px 20px 28px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;height:40px}
.back{border:0;background:none;color:var(--soft);font:500 15px var(--sans);padding:8px 4px;cursor:pointer;visibility:hidden}
.back.on{visibility:visible}
.bar{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden;opacity:0;transition:opacity .3s}
.bar.on{opacity:1}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose-d),var(--pink2));transition:width .45s ease}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 0}
.scr{animation:in .45s cubic-bezier(.2,.7,.2,1)}
.scr.back-in{animation-name:inb}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
h1,h2{font-family:var(--serif);font-weight:500;line-height:1.1;margin:0 0 10px;letter-spacing:.2px}
h1{font-size:40px;text-align:center}
h2{font-size:32px}
.sub{color:var(--soft);font-size:16px;line-height:1.5;margin:0 0 22px}
.hint{color:var(--soft);font-size:13.5px;margin:14px 2px 0;line-height:1.4}
.center{text-align:center}
.logo{display:block;margin:0 auto 14px;width:172px;height:auto;background:var(--logobg);border-radius:24px;padding:6px}
.gold{width:48px;height:1px;background:var(--gold);margin:16px auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid.one{grid-template-columns:1fr}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:14px 10px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;font:500 16px var(--sans);color:var(--ink);text-align:center;cursor:pointer;transition:transform .15s,border-color .2s,background .2s,box-shadow .2s}
.opt:active{transform:scale(.97)}
.opt .e{font-size:26px;line-height:1}
.opt.sel{border-color:var(--gold);background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--rose) 70%,var(--card)));box-shadow:0 6px 18px -8px var(--gold)}
.grid.one .opt{flex-direction:row;justify-content:flex-start;min-height:64px;padding:12px 18px;gap:14px;text-align:left}
.sw{display:flex;gap:3px}
.sw b{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:18px 24px;font:500 17px var(--sans);color:#fff;background:linear-gradient(135deg,var(--rose-d),var(--pink2));box-shadow:0 10px 24px -10px var(--pink2);cursor:pointer;text-align:center;text-decoration:none;margin-top:20px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--rose-d);box-shadow:none;margin-top:12px}
input[type=text],input[type=tel],input[type=email],input[type=date],textarea{width:100%;font:400 17px var(--sans);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:15px 16px;margin-top:10px;outline:0;-webkit-appearance:none;appearance:none}
input:focus{border-color:var(--gold)}
input.bad{border-color:#c0504d}
.err{color:#c0504d;font-size:13.5px;margin:6px 2px 0;min-height:1em}
label.chk{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-size:14.5px;line-height:1.4;color:var(--ink)}
label.chk input{width:22px;height:22px;accent-color:var(--rose-d);flex:none;margin:0}
.file{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:14px;border:1.5px dashed var(--gold);border-radius:16px;color:var(--soft);font-size:15px;cursor:pointer}
.file input{display:none}
.priv{font-size:12.5px;color:var(--soft);text-align:center;margin-top:18px;line-height:1.4}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:420px){h1{font-size:46px}h2{font-size:36px}}
</style>
</head>

const UTM={};["utm_source","utm_medium","utm_campaign","utm_content","utm_term"].forEach(k=>{if(qs.get(k))UTM[k]=qs.get(k)});
function source(){
  const s=(UTM.utm_source||qs.get("src")||"").toLowerCase(),r=document.referrer.toLowerCase(),h=s+" "+r;
  if(/qr/.test(s))return"QR";if(/insta|ig/.test(h))return"Instagram";if(/face|fb|meta/.test(h))return"Facebook";
  if(/whats|wa\.me/.test(h))return"WhatsApp";if(/google/.test(h))return"Google";if(r&&!r.includes(location.host))return"Página web";return s?"Otro":"Directo";
}
window.dataLayer=window.dataLayer||[];
let started=false,done=false,i=-1,t0=0;
const A={};
function track(ev,p){
  const d=Object.assign({event:ev,form:"le_tulipe_lead",source:source()},UTM,p||{});
  dataLayer.push(d);
  try{if(window.gtag)gtag("event",ev,d);if(window.fbq&&ev==="form_complete")fbq("track","Lead")}catch(e){}
}
addEventListener("pagehide",()=>{if(started&&!done)track("form_abandon",{step:i<0?"inicio":STEPS[i]?.k})});
track("form_view");

/* ===== RENDER ===== */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chrome(){
  $("#back").classList.toggle("on",i>0&&i<=STEPS.length);
  $("#bar").classList.toggle("on",i>=0&&i<STEPS.length);
  $("#fill").style.width=Math.max(0,(i+1)/STEPS.length*100)+"%";
}
function show(html,back){stage.innerHTML=`<div class="scr${back?" back-in":""}">${html}</div>`;chrome();scrollTo(0,0)}
function intro(){
  i=-1;
  show(`${LOGO}<h1>Cuéntanos sobre tu evento ✨</h1><div class="gold"></div>
  <p class="sub center">Queremos conocer un poquito de lo que tienes en mente para crear una propuesta especial para ti.</p>
  <p class="center" style="color:var(--gold);font-size:14.5px;margin:0">Te tomará menos de 2 minutos.</p>
  <button class="btn" id="go">Comenzar</button>`);
  $("#go").onclick=()=>{if(!started){started=true;track("form_start");t0=Date.now()}go(0)};
}
function go(n,back){
  i=n;const s=STEPS[n];track("form_step",{step:s.k,n:n+1});
  if(s.t==="single"||s.t==="multi")return pick(s,back);
  if(s.t==="date")return date(s,back);
  contact(s,back);
}
function pick(s,back){
  const multi=s.t==="multi",cur=A[s.k]||(multi?[]:""),oth=A[s.k+"_otro"]||"";
  const isSel=l=>multi?cur.includes(l):cur===l;
  const opts=s.o.map(([e,l,x])=>{
    const sw=Array.isArray(x)?`<span class="sw">${x.map(c=>`<b style="background:${c}"></b>`).join("")}</span>`:"";
    return `<button type="button" class="opt${isSel(l)?" sel":""}" data-l="${esc(l)}" data-o="${x==="other"?1:0}" aria-pressed="${isSel(l)}">${e?`<span class="e">${e}</span>`:""}${sw}<span>${esc(l)}</span></button>`}).join("");
  const showOther=s.other&&s.o.some(([,l,x])=>x==="other"&&isSel(l));
  show(`<h2>${esc(s.q)}</h2>${s.sub?`<p class="sub">${s.sub}</p>`:'<div style="height:12px"></div>'}
  <div class="grid${s.cols===1?" one":""}">${opts}</div>
  ${s.other?`<input type="text" id="oth" placeholder="${esc(s.other)}" value="${esc(oth)}" style="display:${showOther?"block":"none"}" maxlength="80">`:""}
  ${s.photo?`<label class="file">📷 Subir foto de inspiración (opcional)<input type="file" id="ph" accept="image/*"></label><div class="hint" id="phn">${A.foto?"✓ "+esc(A.foto):""}</div>`:""}
  ${s.hint?`<p class="hint">${s.hint}</p>`:""}
  ${multi||s.other?`<button class="btn" id="next">Continuar</button>`:""}`,back);
  const nx=$("#next");
  const upd=()=>{if(nx)nx.disabled=multi?!(A[s.k]||[]).length:(!A[s.k]||(needOther()&&!(A[s.k+"_otro"]||"").trim()))};
  const needOther=()=>s.other&&s.o.some(([,l,x])=>x==="other"&&A[s.k]===l);
  stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const l=b.dataset.l,isO=b.dataset.o==="1";
    if(multi){let a=A[s.k]||[];a=a.includes(l)?a.filter(x=>x!==l):[...a,l];A[s.k]=a;b.classList.toggle("sel");b.setAttribute("aria-pressed",a.includes(l))}
    else{A[s.k]=l;stage.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b))}
    const o=$("#oth");
    if(o){const on=s.o.some(([,ll,x])=>x==="other"&&(multi?(A[s.k]||[]).includes(ll):A[s.k]===ll));o.style.display=on?"block":"none";if(on)o.focus()}
    upd();
    if(!multi&&!isO)setTimeout(()=>next(),260);
  });
  const o=$("#oth");if(o)o.oninput=()=>{A[s.k+"_otro"]=o.value;upd()};
  const ph=$("#ph");if(ph)ph.onchange=()=>{const f=ph.files[0];if(f){A.foto=f.name;$("#phn").textContent="✓ "+f.name}};
  if(nx){nx.onclick=next;upd()}
}
function date(s,back){
  const nd=A.fecha==="Aún no tengo una fecha definida",today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
  show(`<h2>${s.q}</h2><div style="height:12px"></div>
  <div class="hint" style="margin:0">📅 Fecha exacta</div><input type="date" id="d" min="${today}" value="${nd?"":esc(A.fecha||"")}" aria-label="Fecha del evento">
  <button type="button" class="opt${nd?" sel":""}" id="nd" style="width:100%;margin-top:12px;min-height:60px">🤔 Aún no tengo una fecha definida</button>
  <button class="btn" id="next">Continuar</button>`,back);
  const nx=$("#next"),d=$("#d"),nb=$("#nd");
  const upd=()=>nx.disabled=!A.fecha;
  d.onchange=()=>{A.fecha=d.value;nb.classList.remove("sel");upd()};
  nb.onclick=()=>{A.fecha="Aún no tengo una fecha definida";d.value="";nb.classList.add("sel");upd();setTimeout(next,260)};
  nx.onclick=next;upd();
}
function contact(s,back){
  show(`<h2>${s.q}</h2><p class="sub">Solo necesitamos lo básico para escribirte.</p>
  <input type="text" id="n" placeholder="Nombre *" autocomplete="given-name" value="${esc(A.nombre||"")}" maxlength="60"><div class="err" id="en"></div>
  <input type="tel" id="w" placeholder="WhatsApp *" inputmode="tel" autocomplete="tel" value="${esc(A.whatsapp||"")}" maxlength="20"><div class="err" id="ew"></div>
  <input type="email" id="m" placeholder="Correo electrónico (opcional)" autocomplete="email" value="${esc(A.email||"")}"><div class="err" id="em"></div>
  <input type="text" id="ig" placeholder="Instagram (opcional) @usuario" autocapitalize="none" value="${esc(A.instagram||"")}" maxlength="40">
  <label class="chk"><input type="checkbox" id="c"${A.consent?" checked":""}><span>Acepto que Le Tulipe utilice esta información para contactarme y dar seguimiento a mi solicitud de cotización.</span></label><div class="err" id="ec"></div>
  <p class="priv" style="margin:4px 0 0"><a href="${CONFIG.privacyUrl||"#"}" id="pv" target="${CONFIG.privacyUrl?"_blank":"_self"}" rel="noopener" style="color:var(--gold)">Aviso de privacidad</a></p>
  <p class="priv" id="pvt" style="display:none;text-align:left">Usaremos tus datos únicamente para responder tu solicitud, preparar tu cotización y darte seguimiento. No los compartimos con terceros ni los usamos para otros fines. Puedes pedir que los eliminemos escribiéndonos por WhatsApp.</p>
  <button class="btn" id="send">Enviar solicitud</button>`,back);
  $("#send").onclick=submit;$("#pv").onclick=e=>{if(!CONFIG.privacyUrl){e.preventDefault();const t=$("#pvt");t.style.display=t.style.display==="none"?"block":"none"}};
}
const FMT=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||"")?new Date(d+"T12:00:00").toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"}):(d||"");
const normWA=w=>{let d=w.replace(/\D/g,"");if(d.length===13&&d.startsWith("521"))d=d.slice(3);else if(d.length===12&&d.startsWith("52"))d=d.slice(2);return d.length===10?d:null};
async function post(o){
  if(!CONFIG.endpoint)return null;
  const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
  try{const r=await fetch(CONFIG.endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o),signal:c.signal});return await r.json()}catch(e){return null}finally{clearTimeout(t)}
}
function retry(){try{const q=JSON.parse(localStorage.getItem("lt_q")||"[]");if(!q.length||!CONFIG.endpoint)return;Promise.all(q.map(l=>post(l).then(r=>r?null:l))).then(rest=>localStorage.setItem("lt_q",JSON.stringify(rest.filter(Boolean))))}catch(e){}}
function summary(l){return[["Solicitud",l.Folio],["Cliente",l.Nombre],["Evento",l["Tipo de evento"]],["Invitados",l["Número de invitados"]],["Estilo",l.Estilo],["Paleta",l.Paleta],["Servicios",l.Servicios],["Fecha",l["Fecha del evento"]],["Ubicación",l["Ubicación"]],["Presupuesto",l.Presupuesto]].filter(r=>r[1]&&String(r[1]).trim())}
function waMsg(l){
  const inv=l["Número de invitados"],rows=[["🎉 Evento",l["Tipo de evento"]],["👥 Invitados",/\d/.test(inv||"")?inv+" personas":inv],["✨ Estilo",l.Estilo],["🎨 Paleta",l.Paleta],["🍰 Me interesa",(l.Servicios||"").split(", ").join(" + ")],["📅 Fecha",l["Fecha del evento"]],["📍 Zona",l["Ubicación"]],["💰 Presupuesto aproximado",l.Presupuesto]].filter(r=>r[1]&&String(r[1]).trim()).map(r=>r[0]+": "+r[1]);
  return["Hola Le Tulipe ✨","Soy "+l.Nombre+".","Acabo de completar el formulario para solicitar una cotización.","","Mi solicitud es:",l.Folio,"",...rows,"","Me gustaría recibir una propuesta para mi evento.","¡Gracias! ✨"].join("\n");
}
async function submit(){
  const v=id=>$("#"+id).value.trim(),set=(id,m)=>{$("#e"+id).textContent=m;const f=$({n:"#n",w:"#w",m:"#m"}[id]||"#c");f&&f.classList.toggle("bad",!!m)};
  let ok=true;
  const n=v("n"),w=v("w"),m=v("m"),wa=normWA(w);
  if(!n){set("n","Escribe tu nombre.");ok=false}else set("n","");
  if(!wa){set("w","Escribe un WhatsApp válido de 10 dígitos.");ok=false}else set("w","");
  if(m&&!/^\S+@\S+\.\S+$/.test(m)){set("m","Revisa tu correo.");ok=false}else set("m","");
  if(!$("#c").checked){$("#ec").textContent="Necesitamos tu autorización para contactarte.";ok=false}else $("#ec").textContent="";
  Object.assign(A,{nombre:n,whatsapp:w,email:m,instagram:v("ig"),consent:true});
  if(!ok)return;
  const b=$("#send");b.disabled=true;b.textContent="Enviando…";
  const now=new Date(),oth=(k,val)=>val==="Otro"||val==="Otra paleta"?(A[k+"_otro"]||val):val;
  const l={
    "Nombre":n,"WhatsApp":wa,"Correo":m,"Instagram":A.instagram,
    "Tipo de evento":oth("evento",A.evento),"Número de invitados":A.invitados,"Estilo":A.estilo,
    "Paleta":(A.paleta||[]).map(x=>oth("paleta",x)).join(", "),
    "Servicios":(A.servicio||[]).join(", "),
    "Fecha del evento":FMT(A.fecha),"Ubicación":oth("ubicacion",A.ubicacion),
    "Presupuesto":A.presupuesto,"Imagen de inspiración":A.foto||"",
    "Origen del lead":source(),"Campaña":UTM.utm_campaign||"","Medio":UTM.utm_medium||"",
    "Estado":"Nuevo lead","Tiempo de llenado (s)":t0?Math.round((Date.now()-t0)/1000):""
  };
  l.Resumen=summary(l).map(r=>r[0]+": "+r[1]).join(" | ");
  const res=await post(l);   /* 1) guardar primero; 2) el servidor asigna el folio */
  l.Folio=res&&res.folio||("LT-"+now.getFullYear()+"-"+String(Date.now()).slice(-5));
  if(CONFIG.endpoint&&!res){try{const q=JSON.parse(localStorage.getItem("lt_q")||"[]");q.push(l);localStorage.setItem("lt_q",JSON.stringify(q))}catch(e){}}
  if(!CONFIG.endpoint)console.log("LEAD (configura CONFIG.endpoint para guardarlo)",l);
  done=true;track("form_complete",{lead_id:l.Folio,fill_seconds:l["Tiempo de llenado (s)"]});
  thanks(l);
}
function thanks(l){
  i=STEPS.length+1;
  show(`${LOGO}<h1>¡Gracias, ${esc(l.Nombre)}! ✨</h1><div class="gold"></div>
  <p class="sub center" style="margin-bottom:12px">Ya conocemos un poco más sobre tu evento.</p>
  <p class="center" style="margin:0 0 14px">Tu solicitud es: <b style="color:var(--pink2)">${esc(l.Folio)}</b></p>
  <div style="background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px 18px;font-size:15px;line-height:1.7">${summary(l).slice(2).map(r=>`<div><span style="color:var(--soft)">${r[0]}:</span> ${esc(r[1])}</div>`).join("")}</div>
  <p class="sub center" style="margin:14px 0 0;font-size:15px">Con esta información podremos preparar una propuesta mucho más cercana a lo que imaginas.</p>
  <p class="center" style="margin:18px 0 0;color:var(--gold);font-weight:500">Último paso</p>
  <p class="sub center" style="margin:2px 0 0;font-size:15px">Envíanos tu solicitud por WhatsApp para comenzar con tu cotización.</p>
  <a class="btn" id="wa" href="https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(waMsg(l))}" target="_blank" rel="noopener">Solicitar mi cotización por WhatsApp ✨</a>
  <a class="btn ghost" id="ig" href="${CONFIG.instagram}" target="_blank" rel="noopener">Ver Instagram</a>`);
  $("#wa").onclick=()=>{track("click_whatsapp",{lead_id:l.Folio});if(CONFIG.endpoint)try{fetch(CONFIG.endpoint,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"whatsapp_iniciado",Folio:l.Folio})})}catch(e){}};
}
function next(){go(i+1)}
$("#back").onclick=()=>{if(i>0&&i<=STEPS.length)go(i-1,true)};
retry();intro();
</script>
</body>
</html>
